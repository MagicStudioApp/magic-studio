<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:700px;height:420px;overflow:hidden;background:transparent}
body{position:relative;font-family:Arial,sans-serif}
.banner{position:absolute;left:10px;top:4px;width:680px;height:412px;overflow:visible;background:transparent}
.frame{position:absolute;left:0;right:0;top:0;bottom:18px;border-radius:28px;overflow:hidden;background:#06182a;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.bg{position:absolute;inset:0;background:transparent;background-size:cover;background-position:center;filter:none}
.smoke{display:none}
.left-stack{position:absolute;left:18px;top:10px;width:650px;height:380px;z-index:40;pointer-events:none}
.left-img{position:absolute;object-fit:contain;filter:drop-shadow(2px 6px 3px rgba(18,24,34,.28));pointer-events:auto}
.left1{left:-52px!important;top:-22px!important;width:170px;height:128px;transform:perspective(260px) rotateY(-14deg) rotateZ(-5deg);transform-origin:center center}
.left2{left:210px!important;top:0!important;width:250px;height:118px}
.left3{left:486px!important;top:0!important;width:178px;height:92px}
.left4{left:82px!important;top:132px!important;width:220px;height:100px}
.left5{left:345px!important;top:132px!important;width:220px;height:100px}
.figures{position:absolute;left:185px;top:30px;width:520px;height:430px;z-index:30}
.fig{position:absolute;object-fit:contain;filter:drop-shadow(0 0 6px var(--product-glow,#fff));transform-origin:center bottom}
.count-1 .fig1{left:105px;top:0;width:300px;height:410px}
.count-2 .fig1{left:30px;top:20px;width:250px;height:385px}.count-2 .fig2{left:220px;top:12px;width:255px;height:390px}
.count-3 .fig1{left:0;top:48px;width:205px;height:340px}.count-3 .fig2{left:140px;top:6px;width:260px;height:400px}.count-3 .fig3{left:300px;top:44px;width:210px;height:345px}
.count-4 .fig1{left:0;top:74px;width:175px;height:315px}.count-4 .fig2{left:105px;top:34px;width:220px;height:360px}.count-4 .fig3{left:245px;top:30px;width:225px;height:365px}.count-4 .fig4{left:350px;top:76px;width:175px;height:315px}
.count-5 .fig1{left:-5px;top:90px;width:150px;height:290px}.count-5 .fig2{left:76px;top:54px;width:190px;height:330px}.count-5 .fig3{left:178px;top:24px;width:230px;height:365px}.count-5 .fig4{left:310px;top:54px;width:190px;height:330px}.count-5 .fig5{left:400px;top:90px;width:150px;height:290px}
.banner-text{position:absolute;left:24px;right:24px;bottom:36px;z-index:60;color:#fff;font-family:'Bebas Neue','Arial Black',Impact,sans-serif;font-size:38px;font-weight:400;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:1px;text-shadow:0 3px 0 rgba(0,0,0,.62),0 7px 13px rgba(0,0,0,.42);white-space:pre-wrap;transform-origin:center}
.motion-enabled .left-stack,.motion-enabled .figures{animation:goodsFloat calc(var(--motion-duration,4.8s) * var(--motion-speed-factor,1)) ease-in-out infinite;will-change:translate}
.motion-enabled .left-stack{--motion-x:calc(-5px * var(--motion-mult,.45));--motion-y:calc(6px * var(--motion-mult,.45));--motion-duration:5.3s}
.motion-enabled .figures{--motion-x:calc(5px * var(--motion-mult,.45));--motion-y:calc(-8px * var(--motion-mult,.45));--motion-duration:4.9s}
@keyframes goodsFloat{0%,100%{translate:0 0}50%{translate:var(--motion-x,0) var(--motion-y,-6px)}}
@media (prefers-reduced-motion:reduce){.motion-enabled *{animation:none!important}}
.missing{display:none}
</style>
</head>
<body>
<div class="banner">
  <div class="frame">
    <div class="bg"></div>
  <div class="smoke"></div>
  </div>
  <div class="left-stack">
    <img class="left-img left1" data-src="left1_url">
    <img class="left-img left2" data-src="left2_url">
    <img class="left-img left3" data-src="left3_url">
    <img class="left-img left4" data-src="left4_url">
    <img class="left-img left5" data-src="left5_url">
  </div>
  <div class="figures">
    <img class="fig fig1" data-src="figure1_url">
    <img class="fig fig2" data-src="figure2_url">
    <img class="fig fig3" data-src="figure3_url">
    <img class="fig fig4" data-src="figure4_url">
    <img class="fig fig5" data-src="figure5_url">
  </div>
  <div class="banner-text" id="bannerText"></div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const g = key => p.get(key) || '';
const MAX_PRODUCTS = 20;
const MAX_LOGOS = 5;
const count = Math.max(1, Math.min(MAX_PRODUCTS, Number(g('figure_count') || 3)));
const figureBox = document.querySelector('.figures');
for (let i = 6; i <= MAX_PRODUCTS; i++) figureBox.insertAdjacentHTML('beforeend', '<img class="fig fig' + i + '" data-src="figure' + i + '_url">');
figureBox.classList.add('count-' + count);
const bgUrl = g('bg_url');
if (bgUrl) document.querySelector('.bg').style.backgroundImage = "url('" + bgUrl + "')";
else document.querySelector('.bg').style.backgroundImage = 'linear-gradient(135deg,' + (g('fallback_bg') || '#06233a') + ',' + (g('fallback_bg2') || '#2f80c9') + ')';
document.querySelectorAll('img[data-src]').forEach(img => {
  const key = img.getAttribute('data-src');
  const url = g(key);
  if (/left([1-5])_url/.test(key) && g('show_left' + key.match(/left([1-5])_url/)[1]) === '0') {
    img.classList.add('missing');
    return;
  }
  if (!url || (/figure(\d+)_url/.test(key) && Number(key.match(/figure(\d+)_url/)[1]) > count)) {
    img.classList.add('missing');
    return;
  }
  img.src = url;
});
document.documentElement.style.setProperty('--product-glow', g('product_glow') || '#ffffff');
const bannerText = document.getElementById('bannerText');
bannerText.textContent = p.has('banner_text') ? p.get('banner_text') : 'Maintenant disponible';
bannerText.style.color = /^#[0-9a-f]{6}$/i.test(g('banner_text_color')) ? g('banner_text_color') : '#ffffff';
bannerText.style.fontSize = (38 * Math.max(20, Math.min(400, Number(g('banner_text_size') || 100))) / 100) + 'px';
bannerText.style.bottom = (36 - Number(g('banner_text_y') || 0)) + 'px';
bannerText.style.transform = 'translateX(' + Number(g('banner_text_x') || 0) + 'px) rotate(' + Number(g('banner_text_rot') || 0) + 'deg)';
if (g('show_text') === '0') bannerText.classList.add('missing');
function configureMotion() {
  if (g('animation') !== '1') return;
  const intensity = Math.max(0, Math.min(100, Number(g('animIntensity') || 45))) / 100;
  const speed = Math.max(10, Math.min(100, Number(g('animSpeed') || 60))) / 100;
  document.body.classList.add('motion-enabled');
  document.documentElement.style.setProperty('--motion-mult', intensity.toFixed(2));
  document.documentElement.style.setProperty('--motion-speed-factor', (1.55 - speed).toFixed(2));
}
function applyLeftControls() {
  for (let i = 1; i <= MAX_LOGOS; i++) {
    const img = document.querySelector('.left' + i);
    if (!img || img.classList.contains('missing')) continue;
    const size = Number(g('left' + i + '_size') || 100) / 100;
    const x = Number(g('left' + i + '_x') || 0);
    const y = Number(g('left' + i + '_y') || 0);
    const rot = Number(g('left' + i + '_rot') || 0);
    img.style.transform = i === 1
      ? 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') perspective(260px) rotateY(-14deg) rotateZ(' + (-5 + rot) + 'deg)'
      : 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') rotate(' + rot + 'deg)';
  }
}
function applyProductControls() {
  if (count > 5) {
    const rows = count > 10 ? 3 : 2;
    const columns = Math.ceil(count / rows);
    const width = Math.min(175, 520 / (columns + .15) * 1.35);
    const height = Math.min(285, width * 1.55);
    document.querySelectorAll('.fig:not(.missing)').forEach((img, index) => {
      const row = Math.floor(index / columns);
      const column = index % columns;
      img.style.left = (column * ((520 - width) / Math.max(1, columns - 1))) + 'px';
      img.style.top = (row * 112 + (column % 2 ? 10 : 24)) + 'px';
      img.style.width = width + 'px';
      img.style.height = height + 'px';
    });
  }
  for (let i = 1; i <= MAX_PRODUCTS; i++) {
    const img = document.querySelector('.fig' + i);
    if (!img || img.classList.contains('missing')) continue;
    const size = Number(g('product' + i + '_size') || 118) / 100;
    const x = Number(g('product' + i + '_x') || 0);
    const y = Number(g('product' + i + '_y') || 0);
    const rot = Number(g('product' + i + '_rot') || 0);
    const z = Number(g('product' + i + '_z') || (20 + i));
    img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') rotate(' + rot + 'deg)';
    img.style.zIndex = z;
  }
}
applyLeftControls();
applyProductControls();
configureMotion();
document.fonts?.ready?.then(() => document.documentElement.classList.add('fonts-ready'));
</script>
</body>
</html>
