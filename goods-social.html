<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{position:relative;font-family:Arial,sans-serif}
.banner{position:absolute;left:0;top:0;width:1080px;height:1920px;border-radius:0;overflow:hidden;background:#06182a;box-shadow:none}
.bg{position:absolute;inset:0;background:transparent;background-size:cover;background-position:center;filter:none}
.smoke{display:none}
.left-stack{position:absolute;left:44px;top:54px;width:990px;height:600px;z-index:40;pointer-events:none}
.left-img{position:absolute;object-fit:contain;filter:drop-shadow(4px 10px 5px rgba(18,24,34,.28));transform-origin:center center;pointer-events:auto}
.left1{left:-55px;top:18px;width:330px;height:250px;transform:perspective(420px) rotateY(-16deg) rotateZ(-6deg)}
.left2{left:310px;top:12px;width:470px;height:250px}
.left3{left:770px;top:42px;width:260px;height:180px}
.left4{left:145px;top:275px;width:330px;height:190px}
.left5{left:540px;top:275px;width:330px;height:190px}
.figures{position:absolute;left:35px;top:480px;width:970px;height:1220px;z-index:30}
.fig{position:absolute;object-fit:contain;filter:drop-shadow(0 0 10px var(--product-glow,#fff));transform-origin:center bottom}
.count-1 .fig1{left:170px;top:40px;width:660px;height:1120px}
.count-2 .fig1{left:20px;top:140px;width:560px;height:1010px}.count-2 .fig2{left:430px;top:100px;width:580px;height:1030px}
.count-3 .fig1{left:-55px;top:240px;width:430px;height:890px}.count-3 .fig2{left:245px;top:58px;width:600px;height:1070px}.count-3 .fig3{left:660px;top:240px;width:430px;height:890px}
.count-4 .fig1{left:-60px;top:320px;width:360px;height:780px}.count-4 .fig2{left:160px;top:135px;width:500px;height:960px}.count-4 .fig3{left:500px;top:118px;width:510px;height:980px}.count-4 .fig4{left:740px;top:320px;width:360px;height:780px}
.count-5 .fig1{left:-65px;top:400px;width:310px;height:710px}.count-5 .fig2{left:90px;top:255px;width:420px;height:840px}.count-5 .fig3{left:320px;top:110px;width:550px;height:1010px}.count-5 .fig4{left:610px;top:255px;width:420px;height:840px}.count-5 .fig5{left:805px;top:400px;width:310px;height:710px}
.story-text{position:absolute;left:60px;right:60px;bottom:110px;z-index:60;color:#fff;font-family:'Bebas Neue','Arial Black',Impact,sans-serif;font-size:82px;font-weight:400;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:1px;text-shadow:0 6px 0 rgba(0,0,0,.62),0 14px 22px rgba(0,0,0,.45);white-space:pre-wrap;transform-origin:center}
.motion-enabled .bg{animation:goodsBgDrift calc(8s * var(--motion-speed-factor,1)) ease-in-out infinite alternate;transform-origin:center}
.motion-enabled .left-stack,.motion-enabled .figures,.motion-enabled .story-text{animation:goodsFloat calc(var(--motion-duration,4.8s) * var(--motion-speed-factor,1)) ease-in-out infinite;will-change:translate}
.motion-enabled .left-stack{--motion-x:calc(-5px * var(--motion-mult,.45));--motion-y:calc(6px * var(--motion-mult,.45));--motion-duration:5.3s}
.motion-enabled .figures{--motion-x:calc(5px * var(--motion-mult,.45));--motion-y:calc(-8px * var(--motion-mult,.45));--motion-duration:4.9s}
.motion-enabled .story-text{--motion-x:calc(-2px * var(--motion-mult,.45));--motion-y:calc(5px * var(--motion-mult,.45));--motion-duration:5.5s}
@keyframes goodsFloat{0%,100%{translate:0 0}50%{translate:var(--motion-x,0) var(--motion-y,-6px)}}
@keyframes goodsBgDrift{0%{transform:scale(1)}100%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.motion-enabled *{animation:none!important}}
.missing{display:none}
</style>
</head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="smoke"></div>
  <div class="left-stack">
    <img class="left-img left1" data-src="left1_url">
    <img class="left-img left2" data-src="left2_url">
    <img class="left-img left3" data-src="left3_url">
    <img class="left-img left4" data-src="left4_url">
    <img class="left-img left5" data-src="left5_url">
  </div>
  <div class="figures">
    <img class="fig fig1" data-src="figure1_url">
    <img class="fig fig2" data-src="figure2_url">
    <img class="fig fig3" data-src="figure3_url">
    <img class="fig fig4" data-src="figure4_url">
    <img class="fig fig5" data-src="figure5_url">
  </div>
  <div class="story-text" id="storyText"></div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const g = key => p.get(key) || '';
const MAX_PRODUCTS = 20;
const MAX_LOGOS = 5;
const count = Math.max(1, Math.min(MAX_PRODUCTS, Number(g('figure_count') || 3)));
const figureBox = document.querySelector('.figures');
for (let i = 6; i <= MAX_PRODUCTS; i++) figureBox.insertAdjacentHTML('beforeend', '<img class="fig fig' + i + '" data-src="figure' + i + '_url">');
figureBox.classList.add('count-' + count);
const bgUrl = g('bg_url');
if (bgUrl) document.querySelector('.bg').style.backgroundImage = "url('" + bgUrl + "')";
else document.querySelector('.bg').style.backgroundImage = 'linear-gradient(135deg,' + (g('fallback_bg') || '#06233a') + ',' + (g('fallback_bg2') || '#2f80c9') + ')';
document.querySelectorAll('img[data-src]').forEach(img => {
  const key = img.getAttribute('data-src');
  const url = g(key);
  if (/left([1-5])_url/.test(key) && g('show_left' + key.match(/left([1-5])_url/)[1]) === '0') {
    img.classList.add('missing');
    return;
  }
  if (!url || (/figure(\d+)_url/.test(key) && Number(key.match(/figure(\d+)_url/)[1]) > count)) {
    img.classList.add('missing');
    return;
  }
  img.src = url;
});
document.documentElement.style.setProperty('--product-glow', g('product_glow') || '#ffffff');
document.getElementById('storyText').textContent = g('series_text') || 'Série maintenant disponible !';
document.getElementById('storyText').style.color = g('series_text_color') || '#ffffff';
document.getElementById('storyText').style.fontSize = (82 * Math.max(50, Math.min(180, Number(g('story_text_size') || 100))) / 100) + 'px';
document.getElementById('storyText').style.bottom = (110 - Number(g('story_text_y') || 0)) + 'px';
document.getElementById('storyText').style.transform = 'translateX(' + Number(g('story_text_x') || 0) + 'px) rotate(' + Number(g('story_text_rot') || 0) + 'deg)';
function configureMotion() {
  if (g('animation') !== '1') return;
  const intensity = Math.max(0, Math.min(100, Number(g('animIntensity') || 45))) / 100;
  const speed = Math.max(10, Math.min(100, Number(g('animSpeed') || 60))) / 100;
  document.body.classList.add('motion-enabled');
  document.documentElement.style.setProperty('--motion-mult', intensity.toFixed(2));
  document.documentElement.style.setProperty('--motion-speed-factor', (1.55 - speed).toFixed(2));
}
function applyLeftControls() {
  for (let i = 1; i <= MAX_LOGOS; i++) {
    const img = document.querySelector('.left' + i);
    if (!img || img.classList.contains('missing')) continue;
    const size = Number(g('left' + i + '_size') || 100) / 100;
    const x = Number(g('left' + i + '_x') || 0);
    const y = Number(g('left' + i + '_y') || 0);
    const rot = Number(g('left' + i + '_rot') || 0);
    img.style.transform = i === 1
      ? 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') perspective(420px) rotateY(-16deg) rotateZ(' + (-6 + rot) + 'deg)'
      : 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') rotate(' + rot + 'deg)';
  }
}
function applyProductControls() {
  if (count > 5) {
    const rows = count > 10 ? 3 : 2;
    const columns = Math.ceil(count / rows);
    const width = Math.min(330, 970 / (columns + .2) * 1.45);
    const height = Math.min(570, width * 1.65);
    document.querySelectorAll('.fig:not(.missing)').forEach((img, index) => {
      const row = Math.floor(index / columns);
      const column = index % columns;
      img.style.left = (column * ((970 - width) / Math.max(1, columns - 1))) + 'px';
      img.style.top = (row * 330 + (column % 2 ? 35 : 75)) + 'px';
      img.style.width = width + 'px';
      img.style.height = height + 'px';
    });
  }
  for (let i = 1; i <= MAX_PRODUCTS; i++) {
    const img = document.querySelector('.fig' + i);
    if (!img || img.classList.contains('missing')) continue;
    const size = Number(g('product' + i + '_size') || 118) / 100;
    const x = Number(g('product' + i + '_x') || 0);
    const y = Number(g('product' + i + '_y') || 0);
    const rot = Number(g('product' + i + '_rot') || 0);
    const z = Number(g('product' + i + '_z') || (20 + i));
    img.style.transform = 'translate(' + x + 'px,' + y + 'px) scale(' + size + ') rotate(' + rot + 'deg)';
    img.style.zIndex = z;
  }
}
applyLeftControls();
applyProductControls();
configureMotion();
document.fonts?.ready?.then(() => document.documentElement.classList.add('fonts-ready'));
</script>
</body>
</html>
