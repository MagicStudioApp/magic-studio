<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent}
body{position:relative;font-family:Arial,sans-serif}
.banner{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;background:#06182a}
.bg{position:absolute;inset:0;background:transparent;background-size:cover;background-position:center;filter:none}
.smoke{display:none}
.left-stack{position:absolute;left:44px;top:54px;width:990px;height:560px;z-index:45;pointer-events:none}
.left-img{position:absolute;object-fit:contain;filter:drop-shadow(4px 10px 5px rgba(18,24,34,.28));transform-origin:center center;opacity:0;animation:slideIn 5s cubic-bezier(.18,.8,.22,1) both;pointer-events:auto}
.left1{left:-55px;top:18px;width:330px;height:250px}
.left2{left:310px;top:12px;width:470px;height:250px;animation-delay:.18s}
.left3{left:770px;top:42px;width:260px;height:180px;animation-delay:.36s}
.figures{position:absolute;left:0;top:660px;width:1080px;height:900px;z-index:35;overflow:visible}
.fig{position:absolute;left:0;top:0;width:620px;height:900px;object-fit:contain;filter:drop-shadow(0 0 10px var(--product-glow,#fff));transform-origin:center bottom;opacity:0;animation:lineDepthMarquee var(--video-duration,8s) linear infinite;will-change:transform,opacity}
.count-1 .fig1{left:170px;top:20px;width:660px;height:1040px}
.count-2 .fig1{left:20px;top:120px;width:560px;height:930px}.count-2 .fig2{left:430px;top:80px;width:580px;height:950px}
.count-3 .fig1{left:-55px;top:220px;width:430px;height:820px}.count-3 .fig2{left:245px;top:38px;width:600px;height:990px}.count-3 .fig3{left:660px;top:220px;width:430px;height:820px}
.count-4 .fig1{left:-60px;top:300px;width:360px;height:720px}.count-4 .fig2{left:160px;top:115px;width:500px;height:890px}.count-4 .fig3{left:500px;top:98px;width:510px;height:900px}.count-4 .fig4{left:740px;top:300px;width:360px;height:720px}
.count-5 .fig1{left:-65px;top:370px;width:310px;height:660px}.count-5 .fig2{left:90px;top:230px;width:420px;height:780px}.count-5 .fig3{left:320px;top:90px;width:550px;height:940px}.count-5 .fig4{left:610px;top:230px;width:420px;height:780px}.count-5 .fig5{left:805px;top:370px;width:310px;height:660px}
.video-text{position:absolute;left:70px;right:70px;bottom:300px;z-index:60;color:#fff;font-family:'Arial Black',Impact,sans-serif;font-size:82px;line-height:1;text-align:center;text-transform:uppercase;letter-spacing:1px;text-shadow:0 6px 0 rgba(0,0,0,.62),0 14px 22px rgba(0,0,0,.45);opacity:0;animation:textIntro .75s ease-out .15s both;white-space:pre-wrap;transform-origin:center}
.motion-enabled .left-stack,.motion-enabled .figures{animation-name:goodsFloat;animation-duration:calc(var(--motion-duration,4.8s) * var(--motion-speed-factor,1));animation-timing-function:ease-in-out;animation-iteration-count:infinite;will-change:translate}
.motion-enabled .left-stack{--motion-x:calc(-5px * var(--motion-mult,.45));--motion-y:calc(6px * var(--motion-mult,.45));--motion-duration:5.3s}
.motion-enabled .figures{--motion-x:calc(5px * var(--motion-mult,.45));--motion-y:calc(-8px * var(--motion-mult,.45));--motion-duration:4.9s}
@keyframes goodsFloat{0%,100%{translate:0 0}50%{translate:var(--motion-x,0) var(--motion-y,-6px)}}
.missing{display:none}
@keyframes slideIn{
  0%{opacity:0;transform:translate(calc(-180px + var(--user-x,0px)),var(--user-y,0px)) scale(calc(var(--user-scale,1) * .92)) rotate(var(--user-rot,0deg))}
  18%{opacity:1}
  58%{opacity:1;transform:translate(calc(26px + var(--user-x,0px)),var(--user-y,0px)) scale(var(--user-scale,1)) rotate(var(--user-rot,0deg))}
  100%{opacity:1;transform:translate(var(--user-x,0px),var(--user-y,0px)) scale(var(--user-scale,1)) rotate(var(--user-rot,0deg))}
}
@keyframes figureReveal{
  0%{opacity:0;transform:translate(var(--item-x,0px),var(--item-y,0px)) scale(calc(var(--item-scale,1) * .92)) rotate(var(--item-rot,0deg))}
  100%{opacity:1;transform:translate(var(--item-x,0px),var(--item-y,0px)) scale(var(--item-scale,1)) rotate(var(--item-rot,0deg))}
}
@keyframes lineDepthMarquee{
  0%{transform:translate(calc(-720px + var(--item-x,0px)),var(--item-y,0px)) scale(calc(var(--item-scale,1) * .72)) rotate(var(--item-rot,0deg));opacity:0;z-index:20}
  10%{opacity:1}
  38%{transform:translate(calc(-160px + var(--item-x,0px)),var(--item-y,0px)) scale(calc(var(--item-scale,1) * 1.05)) rotate(var(--item-rot,0deg));opacity:1;z-index:40}
  50%{transform:translate(calc(230px + var(--item-x,0px)),var(--item-y,0px)) scale(calc(var(--item-scale,1) * 1.45)) rotate(var(--item-rot,0deg));opacity:1;z-index:70}
  62%{transform:translate(calc(620px + var(--item-x,0px)),var(--item-y,0px)) scale(calc(var(--item-scale,1) * 1.05)) rotate(var(--item-rot,0deg));opacity:1;z-index:40}
  90%{opacity:1}
  100%{transform:translate(calc(1260px + var(--item-x,0px)),var(--item-y,0px)) scale(calc(var(--item-scale,1) * .72)) rotate(var(--item-rot,0deg));opacity:0;z-index:20}
}
@keyframes textIntro{
  0%{opacity:0;transform:translateX(var(--text-x,0px)) translateY(22px) scale(.96) rotate(var(--text-rot,0deg))}
  100%{opacity:1;transform:translateX(var(--text-x,0px)) translateY(0) scale(1) rotate(var(--text-rot,0deg))}
}
@keyframes smokeMove{0%{transform:translateX(-28px) scale(1.02)}100%{transform:translateX(26px) scale(1.06)}}
</style>
</head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="smoke"></div>
  <div class="left-stack">
    <img class="left-img left1" data-src="left1_url">
    <img class="left-img left2" data-src="left2_url">
    <img class="left-img left3" data-src="left3_url">
  </div>
  <div class="figures">
    <img class="fig fig1" data-src="figure1_url">
    <img class="fig fig2" data-src="figure2_url">
    <img class="fig fig3" data-src="figure3_url">
    <img class="fig fig4" data-src="figure4_url">
    <img class="fig fig5" data-src="figure5_url">
  </div>
  <div class="video-text" id="videoText"></div>
</div>
<script>
const p = new URLSearchParams(window.location.search);
const g = key => p.get(key) || '';
const count = Math.max(1, Math.min(15, Number(g('figure_count') || 3)));
const figureBox = document.querySelector('.figures');
for (let i = 6; i <= 15; i++) figureBox.insertAdjacentHTML('beforeend', '<img class="fig fig' + i + '" data-src="figure' + i + '_url">');
figureBox.classList.add('count-' + count);
const speed = Math.max(50, Math.min(160, Number(g('video_speed') || 100))) / 100;
const videoDuration = (count === 1 ? 4.2 : Math.max(7, count * 1.55)) / speed;
document.documentElement.style.setProperty('--video-duration', videoDuration + 's');
const bgUrl = g('bg_url');
if (bgUrl) document.querySelector('.bg').style.backgroundImage = "url('" + bgUrl + "')";
else document.querySelector('.bg').style.backgroundImage = 'linear-gradient(135deg,' + (g('fallback_bg') || '#06233a') + ',' + (g('fallback_bg2') || '#2f80c9') + ')';
document.getElementById('videoText').textContent = g('series_text') || 'Série maintenant disponible !';
document.getElementById('videoText').style.color = g('series_text_color') || '#ffffff';
document.getElementById('videoText').style.fontSize = (82 * Math.max(50, Math.min(180, Number(g('video_text_size') || 100))) / 100) + 'px';
document.getElementById('videoText').style.bottom = (300 - Number(g('video_text_y') || 0)) + 'px';
document.getElementById('videoText').style.setProperty('--text-x', Number(g('video_text_x') || 0) + 'px');
document.getElementById('videoText').style.setProperty('--text-rot', Number(g('video_text_rot') || 0) + 'deg');
function configureMotion() {
  return;
}
document.documentElement.style.setProperty('--product-glow', g('product_glow') || '#ffffff');
document.querySelectorAll('img[data-src]').forEach(img => {
  const key = img.getAttribute('data-src');
  const url = g(key);
  if (/left([1-3])_url/.test(key) && g('show_left' + key.match(/left([1-3])_url/)[1]) === '0') {
    img.classList.add('missing');
    return;
  }
  if (!url || (/figure(\d+)_url/.test(key) && Number(key.match(/figure(\d+)_url/)[1]) > count)) {
    img.classList.add('missing');
    return;
  }
  img.src = url;
});
function applyLeftControls() {
  for (let i = 1; i <= 3; i++) {
    const img = document.querySelector('.left' + i);
    if (!img || img.classList.contains('missing')) continue;
    img.style.setProperty('--user-scale', Number(g('left' + i + '_size') || 100) / 100);
    img.style.setProperty('--user-x', Number(g('left' + i + '_x') || 0) + 'px');
    img.style.setProperty('--user-y', Number(g('left' + i + '_y') || 0) + 'px');
    const baseRotation = i === 1 ? -6 : 0;
    img.style.setProperty('--user-rot', (baseRotation + Number(g('left' + i + '_rot') || 0)) + 'deg');
  }
}
function applyProductControls() {
  const originals = [];
  for (let i = 1; i <= 15; i++) {
    const img = document.querySelector('.fig' + i);
    if (!img || img.classList.contains('missing')) continue;
    originals.push({img, i});
  }
  const productWidth = originals.length === 1 ? 650 : 620;
  const productHeight = 900;
  originals.forEach(({img, i}, index) => {
    const size = Number(g('product' + i + '_size') || 118) / 100;
    const x = Number(g('product' + i + '_x') || 0);
    const y = Number(g('product' + i + '_y') || 0);
    const rot = Number(g('product' + i + '_rot') || 0);
    const z = Number(g('product' + i + '_z') || (20 + i));
    img.style.width = productWidth + 'px';
    img.style.height = productHeight + 'px';
    img.style.setProperty('--item-scale', size);
    img.style.setProperty('--item-x', x + 'px');
    img.style.setProperty('--item-y', y + 'px');
    img.style.setProperty('--item-rot', rot + 'deg');
    img.style.zIndex = z;
    if (originals.length === 1) {
      img.style.left = ((1080 - productWidth) / 2) + 'px';
      img.style.top = '80px';
      img.style.animation = 'figureReveal .55s ease-out .2s both';
    } else {
      img.style.left = '0px';
      img.style.top = '0px';
      img.style.animation = 'lineDepthMarquee var(--video-duration,8s) linear ' + (-index * (videoDuration / originals.length)) + 's infinite';
    }
  });
}
applyLeftControls();
applyProductControls();
configureMotion();
</script>
</body>
</html>
